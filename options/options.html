<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Missend Guard</title>
<style>
    * { box-sizing: border-box; font-family: 'Google Sans', Roboto, 'Hiragino Sans', 'Noto Sans JP', Meiryo, sans-serif; }
    body { margin: 0; background: #fff; color: #202124; min-width: 320px; }
    .wrap { max-width: 400px; margin: 0 auto; padding: 20px 20px 24px; }
    h1 {
        font-size: 16px; font-weight: 500; margin: 0 0 4px;
        display: flex; align-items: center; gap: 10px;
    }
    h1 img { width: 24px; height: 24px; }
    .privacy { font-size: 12px; color: #5f6368; margin: 0 0 8px; }
    h2 {
        font-size: 11px; font-weight: 500; color: #5f6368; letter-spacing: .8px;
        text-transform: uppercase; margin: 20px 0 4px; padding-top: 14px;
        border-top: 1px solid #e8eaed;
    }
    .row {
        display: flex; align-items: center; gap: 12px;
        padding: 9px 0; font-size: 13.5px; cursor: pointer;
    }
    .row .lbl { flex: 1; }
    .row .note { display: block; font-size: 11.5px; color: #9aa0a6; margin-top: 1px; }
    .row input[type="number"] {
        width: 52px; padding: 3px 8px; border: 1px solid #dadce0; border-radius: 8px;
        font-size: 13px; text-align: center;
    }
    /* Material 風スイッチ */
    .sw { position: relative; flex: none; width: 36px; height: 20px; }
    .sw input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
    .sw .track {
        position: absolute; inset: 0; border-radius: 10px;
        background: #dadce0; transition: background .15s; pointer-events: none;
    }
    .sw .thumb {
        position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
        border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(60,64,67,.4);
        transition: transform .15s; pointer-events: none;
    }
    .sw input:checked ~ .track { background: #1a73e8; }
    .sw input:checked ~ .thumb { transform: translateX(16px); }
    .sw input:focus-visible ~ .track { outline: 2px solid #1a73e8; outline-offset: 2px; }
    .datarow { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
    .stats { flex: 1; font-size: 12.5px; color: #5f6368; }
    button.clear {
        border: none; background: none; color: #c5221f; font-size: 13px; font-weight: 500;
        padding: 7px 12px; border-radius: 16px; cursor: pointer;
    }
    button.clear:hover { background: #fce8e6; }
    a.help { color: #1a73e8; font-size: 13px; text-decoration: none; padding: 4px 0; }
    a.help:hover { text-decoration: underline; }
    #recipList { max-height: 220px; overflow-y: auto; border: 1px solid #e8eaed; border-radius: 8px; }
    #recipList:empty { display: none; }
    .reciprow { display: flex; align-items: center; gap: 8px; padding: 7px 12px; font-size: 12.5px; border-bottom: 1px solid #f1f3f4; }
    .reciprow:last-child { border-bottom: none; }
    .reciprow .em { flex: 1; font-family: 'Roboto Mono', monospace; color: #3c4043; word-break: break-all; }
    .reciprow .em b { font-family: inherit; color: #202124; font-weight: 500; }
    .reciprow button { border: none; background: none; color: #c5221f; font-size: 12px; cursor: pointer; padding: 3px 8px; border-radius: 12px; white-space: nowrap; }
    .reciprow button:hover { background: #fce8e6; }
    .empty { padding: 12px; font-size: 12.5px; color: #9aa0a6; text-align: center; }
    #saved {
        position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
        background: #202124; color: #e8eaed; padding: 9px 16px; border-radius: 8px;
        font-size: 12.5px; opacity: 0; transition: opacity .25s; pointer-events: none;
    }
    #saved.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
    <h1><img src="../icons/icon48.png" alt=""><span data-i18n="opt_title"></span></h1>
    <p class="privacy" data-i18n="opt_privacy"></p>

    <h2 data-i18n="opt_section_rules"></h2>
    <label class="row"><span class="lbl" data-i18n="opt_rule_first"></span><span class="sw"><input type="checkbox" id="checkFirstRecipient"><span class="track"></span><span class="thumb"></span></span></label>
    <label class="row"><span class="lbl" data-i18n="opt_rule_lookalike"></span><span class="sw"><input type="checkbox" id="checkLookalike"><span class="track"></span><span class="thumb"></span></span></label>
    <label class="row"><span class="lbl" data-i18n="opt_rule_known"></span><span class="sw"><input type="checkbox" id="checkKnownLookalike"><span class="track"></span><span class="thumb"></span></span></label>
    <label class="row"><span class="lbl" data-i18n="opt_rule_greeting"></span><span class="sw"><input type="checkbox" id="checkGreeting"><span class="track"></span><span class="thumb"></span></span></label>
    <label class="row"><span class="lbl" data-i18n="opt_rule_thread"></span><span class="sw"><input type="checkbox" id="checkThreadDelta"><span class="track"></span><span class="thumb"></span></span></label>
    <label class="row"><span class="lbl" data-i18n="opt_rule_combo"></span><span class="sw"><input type="checkbox" id="checkNewCombo"><span class="track"></span><span class="thumb"></span></span></label>
    <label class="row"><span class="lbl" data-i18n="opt_rule_many"></span><input type="number" id="manyVisibleThreshold" min="2" max="100"><span class="sw"><input type="checkbox" id="checkManyVisible"><span class="track"></span><span class="thumb"></span></span></label>

    <h2 data-i18n="opt_section_mode"></h2>
    <label class="row"><span class="lbl"><span data-i18n="opt_skip_internal"></span><span class="note" data-i18n="opt_skip_internal_note"></span></span><span class="sw"><input type="checkbox" id="checkSkipInternal"><span class="track"></span><span class="thumb"></span></span></label>
    <label class="row"><span class="lbl" data-i18n="opt_strict"></span><span class="sw"><input type="checkbox" id="strictMode"><span class="track"></span><span class="thumb"></span></span></label>
    <label class="row"><span class="lbl" data-i18n="opt_learn"></span><span class="sw"><input type="checkbox" id="learnEnabled"><span class="track"></span><span class="thumb"></span></span></label>
    <label class="row"><span class="lbl" data-i18n="opt_showToast"></span><span class="sw"><input type="checkbox" id="showToast"><span class="track"></span><span class="thumb"></span></span></label>
    <label class="row"><span class="lbl"><span data-i18n="opt_sync"></span><span class="note" data-i18n="opt_sync_note"></span></span><span class="sw"><input type="checkbox" id="syncEnabled"><span class="track"></span><span class="thumb"></span></span></label>
    <div class="note" id="syncInfo" style="margin-left:0"></div>

    <h2 data-i18n="opt_section_learned"></h2>
    <p class="note" data-i18n="opt_learned_hint" style="margin-left:0"></p>
    <input type="search" id="recipSearch" data-i18n-ph="opt_search_recipients" style="width:100%;padding:7px 10px;border:1px solid #dadce0;border-radius:8px;font-size:13px;margin:4px 0 8px">
    <div id="recipList"></div>
    <div class="datarow">
        <button class="clear" id="undo" data-i18n="opt_undo" style="color:#1a73e8"></button>
    </div>

    <h2 data-i18n="opt_section_data"></h2>
    <div class="note" id="statusLine" style="margin-left:0;color:#c5221f"></div>
    <div class="datarow">
        <span class="stats" id="stats"></span>
        <button class="clear" id="clear" data-i18n="opt_clear"></button>
    </div>

    <div class="datarow">
        <a class="help" href="../help/help.html" target="_blank" data-i18n="opt_help"></a>
    </div>

    <p class="note" data-i18n="opt_review_note" style="margin:14px 0 2px;padding-top:12px;border-top:1px solid #e8eaed"></p>
    <div class="datarow" style="gap:16px">
        <a class="help" id="reviewLink" target="_blank" rel="noopener" data-i18n="opt_review_link"></a>
        <a class="help" id="feedbackLink" target="_blank" rel="noopener" data-i18n="opt_feedback_link"></a>
    </div>
</div>
<div id="saved" data-i18n="opt_saved"></div>
<script src="../src/risk-engine.js"></script>
<script src="../src/sync-codec.js"></script>
<script src="../src/history-store.js"></script>
<script src="../src/review-gate.js"></script>
<script src="options.js"></script>
</body>
</html>
